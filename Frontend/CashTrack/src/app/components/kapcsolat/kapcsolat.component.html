<app-header></app-header>
<div class="container mt-5" style="color: white;">
    <div data-aos="fade-down" data-aos-duration="2500" class="row">
      <div class="col-4 textCenter">
        <img class="devPics" src="assets/media/connections/mettyu.jpg" alt="Profilfotó">
        <br>
        <h4 class="mt-3">Martocean Máté</h4>
        <h5>Frontend fejlesztő</h5>
        <p>martocean.mate&#64;szikszi-ozd.hu</p>
        <p class="textCenter">
          <a href="https://github.com/hatarvedo" target="_blank"><i class="bi bi-github"></i></a>
        </p>
      </div>

      <div class="col-4 textCenter">
        <img class="devPics" src="assets/media/connections/dominik.jpg" alt="Profilfotó">
        <br>
        <h4 class="mt-3">Pacza Dominik</h4>
        <h5>Adatbázis fejlesztő</h5>
        <p>pacza.dominik&#64;szikszi-ozd.hu</p>
        <p class="textCenter">
          <a href="https://github.com/dominikpacza" target="_blank"><i class="bi bi-github"></i></a>
        </p>
      </div>

      <div class="col-4 textCenter">
        <img class="devPics" src="assets/media/connections/martin.jpg" alt="Profilfotó">
        <br>
        <h4 class="mt-3">Porkoláb Martin</h4>
        <h5>Backend fejlesztő</h5>
        <p>porkolab.martin&#64;szikszi-ozd.hu</p>
        <p class="textCenter">
          <a href="https://github.com/trashieeeee" target="_blank"><i class="bi bi-github"></i></a>
        </p>
      </div>

      <div class="row justify-content-center mt-5">
        <div class="reportDiv col-12 col-md-8 col-lg-6 container pt-3 pb-3 textCenter mb-4">
            <h3>Kérdésed van? Kérdezz bátran!</h3>
            <form class="report" action="https://formsubmit.co/martocean.mate@szikszi-ozd.hu" method="POST">
                <div class="d-flex justify-content-center">
                    <input type="text" name="name" id="nev" placeholder="Név" class="form-control mt-2 w-50" required>
                </div>
                <div class="d-flex justify-content-center">
                    <input type="text" name="email" id="email" placeholder="E-mail" class="form-control mt-2 w-50" required>
                </div>
                <div class="d-flex justify-content-center">
                    <input type="text" name="Subject" id="targy" placeholder="Tárgy" class="form-control mt-2 w-50" required>
                </div>
                <div class="d-flex justify-content-center">
                    <input type="text" name="message" id="uzenet" placeholder="Üzenet" class="form-control mt-2 w-50 uzenet" required>
                </div>
                <input type="hidden" name="_captcha" value="false">
               <input type="hidden" name="_next" value="http://localhost:4200/kapcsolat">
                <div class="d-flex justify-content-center">
                    <button class="mt-3 mb-1" type="submit" (click)="sendEmail()">Küldés</button>
                </div>
            </form>
        </div>
      </div>

    </div>
  </div>
